name: Build YUMY Ocean Android APK
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install
      - run: npx cap add android
      - run: npx cap sync android
      - name: Set Android release version
        run: bash scripts/set-android-version.sh
      - name: Install YUMY launcher icon resources
        shell: bash
        run: |
          # Capacitor already generates values/ic_launcher_background.xml.
          # Copy only launcher mipmap resources to avoid duplicate color resources.
          for dir in android-icons/mipmap-*; do
            [ -d "$dir" ] && cp -R "$dir" android/app/src/main/res/
          done
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - name: Rename APK artifact
        run: cp android/app/build/outputs/apk/debug/app-debug.apk YUMY-Ocean-v1.0.0-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: YUMY-Ocean-1.0.0-debug-apk
          path: YUMY-Ocean-v1.0.0-debug.apk
