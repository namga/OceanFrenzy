name: Ocean Frenzy Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Show exact source revision
        run: |
          echo "Commit: $(git rev-parse HEAD)"
          echo "Workflow: .github/workflows/build-apk.yml"
          # Only flag an actual workflow action invocation; do not match this guard itself.
          if grep -RInE '^[[:space:]]*uses:[[:space:]]*android-actions/setup-android@v3([[:space:]]|$)' .github/workflows; then
            echo "::error::An active workflow still invokes android-actions/setup-android@v3."
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # GitHub's Ubuntu runner already includes Android SDK.
      # Avoid android-actions/setup-android entirely; its package input
      # was the source of the repeated combined-package parsing failure.
      - name: Locate preinstalled Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK" ]; then
            for candidate in /usr/local/lib/android/sdk "$HOME/Android/Sdk"; do
              if [ -d "$candidate" ]; then SDK="$candidate"; break; fi
            done
          fi
          if [ -z "$SDK" ] || [ ! -d "$SDK" ]; then
            echo "::error::Android SDK not found on GitHub runner."
            env | sort | grep -E 'ANDROID|JAVA' || true
            exit 1
          fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          SDKMANAGER="$(find "$SDK/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found under $SDK/cmdline-tools"
            find "$SDK" -maxdepth 4 -type f -name sdkmanager -print || true
            exit 1
          fi
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          "$SDKMANAGER" --version

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install "platform-tools"
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install "platforms;android-35"
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install "build-tools;35.0.0"
          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"
          test -x "$ANDROID_HOME/platform-tools/adb"

      - name: Install npm dependencies
        run: npm install --no-audit --no-fund

      - name: Validate game source
        run: npm run check

      - name: Verify Capacitor web assets
        shell: bash
        run: |
          set -euo pipefail
          test -d www
          test -s www/index.html
          echo "Capacitor webDir=www verified"
          find www -maxdepth 2 -type f -printf '%p %s bytes\\n' | sort

      - name: Create Android project
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d android ]; then
            npx cap add android
          fi
          test -f android/gradlew

      - name: Sync web assets
        run: npx cap sync android
      - name: Apply Ocean Frenzy launcher icons
        shell: bash
        run: |
          set -euo pipefail
          python -m venv /tmp/icon-venv
          /tmp/icon-venv/bin/pip install --quiet Pillow
          RES="android/app/src/main/res"
          mkdir -p "$RES/mipmap-anydpi-v26" "$RES/values"
          /tmp/icon-venv/bin/python - <<'PY'
          from PIL import Image
          from pathlib import Path
          src=Image.open('icon-512.png').convert('RGBA')
          sizes={'mdpi':48,'hdpi':72,'xhdpi':96,'xxhdpi':144,'xxxhdpi':192}
          res=Path('android/app/src/main/res')
          for density,size in sizes.items():
              folder=res/f'mipmap-{density}'
              folder.mkdir(parents=True,exist_ok=True)
              src.resize((size,size),Image.Resampling.LANCZOS).save(folder/'ic_launcher.png')
              src.resize((size,size),Image.Resampling.LANCZOS).save(folder/'ic_launcher_round.png')
              canvas=Image.new('RGBA',(size,size),(6,43,73,255))
              art=src.resize((int(size*.68),int(size*.68)),Image.Resampling.LANCZOS)
              canvas.alpha_composite(art,((size-art.width)//2,(size-art.height)//2))
              canvas.save(folder/'ic_launcher_foreground.png')
          PY
          cat > "$RES/values/ic_launcher_background.xml" <<'XML'
          <resources><color name="ic_launcher_background">#062B49</color></resources>
          XML
          cat > "$RES/mipmap-anydpi-v26/ic_launcher.xml" <<'XML'
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
            <background android:drawable="@color/ic_launcher_background"/>
            <foreground android:drawable="@mipmap/ic_launcher_foreground"/>
          </adaptive-icon>
          XML
          cp "$RES/mipmap-anydpi-v26/ic_launcher.xml" "$RES/mipmap-anydpi-v26/ic_launcher_round.xml"
          echo "Ocean Frenzy launcher icons installed"


      - name: Apply app name and version
        shell: bash
        run: |
          set -euo pipefail
          if [ -f android/app/src/main/res/values/strings.xml ]; then
            sed -i 's/<string name="app_name">.*<\/string>/<string name="app_name">Ocean Frenzy<\/string>/' android/app/src/main/res/values/strings.xml
          fi
          VERSION="$(node -p "require('./package.json').version")"
          if [ -f android/app/build.gradle ]; then
            sed -i "s/versionName \"[^\"]*\"/versionName \"$VERSION\"/" android/app/build.gradle
          elif [ -f android/app/build.gradle.kts ]; then
            sed -i "s/versionName = \"[^\"]*\"/versionName = \"$VERSION\"/" android/app/build.gradle.kts
          fi
          echo "APK versionName=$VERSION"

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Verify and rename APK
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          mkdir -p release
          VERSION="$(node -p "require('./package.json').version")"
          cp "$APK" "release/Ocean-Frenzy-v${VERSION}-Android-debug.apk"
          ls -lh "release/Ocean-Frenzy-v${VERSION}-Android-debug.apk"

      - name: Set release version
        id: version
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ocean-Frenzy-v${{ steps.version.outputs.value }}-Android-APK
          path: release/Ocean-Frenzy-v${{ steps.version.outputs.value }}-Android-debug.apk
          if-no-files-found: error
