name: Build Ocean Frenzy Android APK
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Install dependencies
        run: npm install
      - name: Validate game source
        run: npm run check
      - name: Create Android project
        run: npx cap add android
        continue-on-error: true
      - name: Sync web assets
        run: npx cap sync android
      - name: Apply app branding and version
        shell: bash
        run: |
          mkdir -p android/app/src/main/res/mipmap-mdpi android/app/src/main/res/mipmap-hdpi android/app/src/main/res/mipmap-xhdpi android/app/src/main/res/mipmap-xxhdpi android/app/src/main/res/mipmap-xxxhdpi
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do cp icon-512.png "android/app/src/main/res/mipmap-${density}/ic_launcher.png"; done
          if [ -f android/app/src/main/res/values/strings.xml ]; then
            sed -i 's/<string name="app_name">.*<\/string>/<string name="app_name">Ocean Frenzy<\/string>/' android/app/src/main/res/values/strings.xml
          fi
          sed -i 's/versionName ".*"/versionName "1.0.1"/' android/app/build.gradle
      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - name: Rename APK
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/debug/app-debug.apk release/Ocean-Frenzy-v1.0.1-Android-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Ocean-Frenzy-v1.0.1-Android-APK
          path: release/Ocean-Frenzy-v1.0.1-Android-debug.apk
