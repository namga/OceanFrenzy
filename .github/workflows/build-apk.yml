name: Build Ocean Frenzy Android APK
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # Pin a known stable Android command-line tools package instead of latest.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 11076708
          packages: |
            platform-tools
            platforms;android-35
            build-tools;35.0.0
      - name: Verify Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -x "$ANDROID_HOME/cmdline-tools/$(ls "$ANDROID_HOME/cmdline-tools" | grep -E '^[0-9]+$' | head -n 1)/bin/sdkmanager" || true
          sdkmanager --version
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --list_installed
      - name: Install dependencies
        run: npm install
      - name: Validate game source
        run: npm run check
      - name: Create Android project
        shell: bash
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi
      - name: Sync web assets
        run: npx cap sync android
      - name: Apply app branding and version
        shell: bash
        run: |
          mkdir -p android/app/src/main/res/mipmap-mdpi android/app/src/main/res/mipmap-hdpi android/app/src/main/res/mipmap-xhdpi android/app/src/main/res/mipmap-xxhdpi android/app/src/main/res/mipmap-xxxhdpi
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do cp icon-512.png "android/app/src/main/res/mipmap-${density}/ic_launcher.png"; done
          if [ -f android/app/src/main/res/values/strings.xml ]; then
            sed -i 's/<string name="app_name">.*<\/string>/<string name="app_name">Ocean Frenzy<\/string>/' android/app/src/main/res/values/strings.xml
          fi
          if [ -f android/app/build.gradle ]; then
            sed -i 's/versionName " .*"/versionName "1.0.2"/' android/app/build.gradle || true
            sed -i 's/versionName "[^"]*"/versionName "1.0.2"/' android/app/build.gradle
          elif [ -f android/app/build.gradle.kts ]; then
            sed -i 's/versionName = "[^"]*"/versionName = "1.0.2"/' android/app/build.gradle.kts
          fi
      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew --no-daemon assembleDebug
      - name: Verify APK output
        shell: bash
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          mkdir -p release
          cp android/app/build/outputs/apk/debug/app-debug.apk release/Ocean-Frenzy-v1.0.2-Android-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Ocean-Frenzy-v1.0.2-Android-APK
          path: release/Ocean-Frenzy-v1.0.2-Android-debug.apk
          if-no-files-found: error
