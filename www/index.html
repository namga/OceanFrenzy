<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#062b43"><meta name="description" content="YUMY Ocean 0.8.3 - Navigation & Back Gesture"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="assets/icon.png"><link rel="stylesheet" href="style.css"><title>YUMY Ocean 0.8.3</title></head>
<body><main id="game"><canvas id="c" width="1280" height="720"></canvas><div id="menu" class="overlay">
<section class="menu-panel">
  <div id="homeView" class="menu-view">
    <div class="brand-mark">🐠</div>
    <h1>YUMY <span>OCEAN</span></h1>
    <p class="tagline">Khám phá đại dương · Ăn cá nhỏ hơn · Tránh kẻ săn mồi</p>
    <div class="home-mode-list">
      <button class="mode-card survival-card" id="survivalMode"><span class="mode-icon">♾️</span><b>SINH TỒN</b><small>Sống sót lâu nhất có thể. Không cần chọn bản đồ.</small><em>CHƠI NGAY →</em></button>
      <button class="mode-card adventure-card" id="adventureMode"><span class="mode-icon">🗺️</span><b>PHIÊU LƯU</b><small>Khám phá từng vùng biển, hoàn thành mục tiêu để mở khóa màn mới.</small><em>CHỌN VÙNG BIỂN →</em></button>
    </div>
    <div class="home-footer"><span>🎮 Điều khiển chạm và kéo</span><span>🌊 9 vùng biển phiêu lưu</span></div>
  </div>
  <div id="mapView" class="menu-view hidden">
    <div class="subnav"><button id="mapBack" class="back-btn" aria-label="Quay lại">‹</button><div><h2>BẢN ĐỒ ĐẠI DƯƠNG</h2><small id="mapProgress">1 / 9 vùng biển đã mở khóa</small></div><span class="map-compass">✦</span></div>
    <div class="map-legend"><span>🟢 Hoàn thành</span><span>🟡 Có thể chơi</span><span>🔒 Chưa mở</span></div>
    <div id="stageGrid" class="stage-grid ocean-map"></div>
    <div id="stageDetails" class="stage-details"><b>🪸 Rạn san hô</b><span>900 điểm · Khởi đầu êm đềm</span></div>
    <button id="mapStart" class="map-start">BẮT ĐẦU MÀN CHƠI</button>
  </div>
</section>
</div><div id="pause" class="overlay hidden"><section class="menu-actions">
  <div id="pauseHomeView" class="pause-view">
    <h2>MENU</h2><p class="menu-hint">Trò chơi đang tạm dừng</p>
    <button id="resume">TIẾP TỤC</button>
    <button id="openAudioSettings" class="secondary">CÀI ĐẶT</button>
    <button id="pauseToMenu" class="secondary">CHỌN CHẾ ĐỘ / MÀN</button>
  </div>
  <div id="pauseAudioView" class="pause-view hidden">
    <div class="pause-subnav"><button id="audioBack" class="back-btn" aria-label="Quay lại">‹</button><h2>CÀI ĐẶT ÂM THANH</h2></div>
    <div id="audioSettings" class="audio-settings">
      <label class="audio-setting"><span>Nhạc nền</span><input id="musicToggle" type="checkbox"></label>
      <label class="audio-setting"><span>Âm lượng nhạc</span><input id="musicVolume" type="range" min="0" max="100" value="22"></label>
      <label class="audio-setting"><span>Hiệu ứng âm thanh</span><input id="sfxToggle" type="checkbox"></label>
      <label class="audio-setting"><span>Âm lượng hiệu ứng</span><input id="sfxVolume" type="range" min="0" max="100" value="95"></label>
    </div>
  </div>
</section></div><div id="over" class="overlay hidden"><section><h2 id="overTitle">HẾT LƯỢT</h2><p id="result"></p><button id="again">CHƠI LẠI</button><button id="backToMenu" class="secondary">CHỌN CHẾ ĐỘ / MÀN</button></section></div><button id="webMenuBtn" aria-label="Mở menu" style="display:none">MENU</button></main><script src="game.js"></script></body></html>
